# DMD + Reward Forcing Training Configuration
# This configuration enables Reward Forcing: reward-weighted DMD loss
# without differentiable reward backpropagation.
#
# Key Difference from dmd_rl:
#   dmd_rl:           loss = dmd_loss + rl_weight * (-reward)    [gradient through reward model]
#   reward_forcing:   loss = exp(beta * reward) * dmd_loss       [reward is no-grad scalar weight]
#
# Benefits:
# - Much lower VRAM (no reward model gradient chain, no gradient checkpointing)
# - No FSDP needed for reward model
# - More stable training (reward only modulates learning intensity)
# - All VQ/MQ/TA/overall scores logged for monitoring
#
# Usage:
#   torchrun --nproc_per_node=8 train.py --config configs/self_forcing_dmd_reward_forcing.yaml

# Generator checkpoint (pre-trained)
generator_ckpt: checkpoints/self_forcing_dmd.pt

# FSDP wrap strategies
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size

# Model names
real_name: Wan2.1-T2V-1.3B

# Denoising configuration
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow

# Precision and seed
mixed_precision: true
seed: 0

# Wandb logging (replace with your credentials)
wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT

# Distributed training
sharding_strategy: hybrid_full

# Optimizer settings
lr: 2.0e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
weight_decay: 0.01

# Data
data_path: prompts/vidprom_filtered_extended.txt
batch_size: 1

# EMA
ema_weight: 0.99
ema_start_step: 200
log_iters: 200

# Negative prompt for CFG
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

# Training ratio
dfake_gen_update_ratio: 5

# Video shape [B, T, C, H, W]
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104

# ============================================
# DMD + Reward Forcing configuration
# ============================================
distribution_loss: dmd_rl
trainer: score_distillation

# Reward Forcing mode: reward as NO-GRAD scalar weight on DMD loss
reward_forcing: true                # Enable Reward Forcing mode
reward_forcing_beta: 2.0            # Temperature: exp(beta * reward). Higher = more reward-sensitive
reward_forcing_score_type: overall  # Which score for weighting: 'VQ', 'MQ', 'TA', 'overall'
                                    # All individual scores always logged regardless of this setting

# Reward model configuration
rl_cold_start_steps: 0              # No cold start needed (reward forcing is lightweight)
rl_reward_checkpoint: VideoAlign/checkpoints
rl_target_height: 336
rl_target_width: 504
rl_reward_num_frames: 8
rl_reward_fsdp: true                # Still useful: shards Qwen2-VL weights across GPUs even without gradients
rl_reward_cpu_offload: false        # Set to true to offload reward model to CPU (saves ~14GB GPU per card)
vae_fsdp: false                     # Set to true to FSDP-shard the frozen VAE across GPUs
vae_cpu_offload: false              # Set to true to offload VAE to CPU
vae_fsdp_wrap_strategy: size
rl_reward_ema_decay: 0.99

# ============================================
# LoRA configuration
# ============================================
use_lora: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0

# Other settings
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
no_visualize: true
no_save: false
gc_interval: 50
output_dir: output

# Experiment naming and training control
exp_name: reward_forcing_test
max_training_steps: 500
gradient_accumulation_steps: 1
num_demo_videos: 20
checkpoint_num_videos: 5            # Generate 5 videos at each checkpoint save

# Self-forcing specific
num_training_frames: 21
independent_first_frame: false
same_step_across_blocks: true
backward_simulation: true
last_step_only: false
context_noise: 0.0
i2v: false

# Model kwargs
model_kwargs:
  timestep_shift: 5.0

# Gradient clipping
max_grad_norm_generator: 10.0
max_grad_norm_critic: 10.0
